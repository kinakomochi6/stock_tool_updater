name: Repair Balance Sheets

concurrency:
  group: repair-balance-sheets-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - bs-repair-v2
  workflow_dispatch:
    inputs:
      confirm_full_bs_repair:
        description: 'Confirm a full B/S-only Firestore repair'
        required: true
        type: boolean
        default: false

jobs:
  repair:
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm_full_bs_repair == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run B/S repair shard
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          ALLOW_FULL_FIRESTORE_WRITE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python firebase_master_test.py \
            --bs-only 2>&1 | tee repair.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 12 repair.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=B/S repair failed::$message"
            exit "$status"
          fi
