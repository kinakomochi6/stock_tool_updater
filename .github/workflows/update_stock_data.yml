name: Update Stock Data

on:
  push:
    branches:
      - bs-diagnostics
      - bs-regression
      - bs-breadth
      - bs-stress
      - bs-wave-a
      - bs-wave-b
      - bs-wave-c
      - bs-wave-d
      - bs-wave-e
      - bs-wave-f
      - bs-wave-g
      - bs-wave-h
      - bs-wave-i
      - bs-wave-j
      - bs-wave-k
      - bs-wave-l
  schedule:
    # Midnight JST (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      codes:
        description: 'Optional comma-separated stock codes'
        required: false
        default: ''
      test_set:
        description: 'Curated B/S diagnostic set'
        required: true
        type: choice
        default: 'none'
        options:
          - none
          - regression-40
          - expansion-60
          - breadth-100
          - stress-100
          - wave-a-100
          - wave-b-100
          - wave-c-100
          - wave-d-100
          - wave-e-100
          - wave-f-100
          - wave-g-100
          - wave-h-100
          - wave-i-100
          - wave-j-100
          - wave-k-100
          - wave-l-100
          - market-100
          - market-200
          - market-300
          - market-500
          - market-700
          - market-900
          - market-1100
          - market-1300
          - market-1400
          - market-1500
      days_back:
        description: 'Days of EDINET documents to scan'
        required: false
        default: '365'
      debug_bs:
        description: 'Generate B/S diagnostic JSON files'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Skip Firestore writes'
        required: false
        type: boolean
        default: true
      bs_only:
        description: 'Skip non-B/S data during diagnostics'
        required: false
        type: boolean
        default: true

jobs:
  scrape:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper shard
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          ALLOW_FULL_FIRESTORE_WRITE: "1"
          PYTHONUNBUFFERED: "1"
        run: python firebase_master_test.py --total-shards 8 --shard-index ${{ matrix.shard }}

  manual_guard:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.codes == '' && github.event.inputs.test_set == 'none' }}
    runs-on: ubuntu-latest
    steps:
      - name: Stop unsafe manual full update
        run: |
          echo "Manual full updates are disabled. Enter codes or choose a test_set."
          exit 1

  diagnose:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.codes != '' || github.event.inputs.test_set != 'none')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run B/S unit tests
        run: python -m unittest test_bs_unit.py

      - name: Run selected codes
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TEST_SET="expansion-60"
            if [ "${{ github.ref_name }}" = "bs-regression" ]; then
              TEST_SET="regression-40"
            elif [ "${{ github.ref_name }}" = "bs-breadth" ]; then
              TEST_SET="breadth-100"
            elif [ "${{ github.ref_name }}" = "bs-stress" ]; then
              TEST_SET="stress-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-a" ]; then
              TEST_SET="wave-a-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-b" ]; then
              TEST_SET="wave-b-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-c" ]; then
              TEST_SET="wave-c-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-d" ]; then
              TEST_SET="wave-d-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-e" ]; then
              TEST_SET="wave-e-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-f" ]; then
              TEST_SET="wave-f-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-g" ]; then
              TEST_SET="wave-g-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-h" ]; then
              TEST_SET="wave-h-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-i" ]; then
              TEST_SET="wave-i-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-j" ]; then
              TEST_SET="wave-j-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-k" ]; then
              TEST_SET="wave-k-100"
            elif [ "${{ github.ref_name }}" = "bs-wave-l" ]; then
              TEST_SET="wave-l-100"
            fi
            python firebase_master_test.py \
              --test-set "$TEST_SET" \
              --days-back 365 \
              --debug-bs \
              --debug-dir diagnostics \
              --bs-only \
              --dry-run
            exit 0
          fi

          ARGS=(firebase_master_test.py --days-back "${{ github.event.inputs.days_back }}")
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS+=(--codes "${{ github.event.inputs.codes }}")
          fi
          if [ "${{ github.event.inputs.test_set }}" != "none" ]; then
            ARGS+=(--test-set "${{ github.event.inputs.test_set }}")
          fi
          if [ "${{ github.event.inputs.debug_bs }}" = "true" ]; then
            ARGS+=(--debug-bs --debug-dir diagnostics)
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "${{ github.event.inputs.bs_only }}" = "true" ]; then
            ARGS+=(--bs-only)
          fi
          printf 'python'
          printf ' %q' "${ARGS[@]}"
          printf '\n'
          python "${ARGS[@]}"

      - name: Build B/S diagnostics report
        if: ${{ always() && (github.event_name == 'push' || github.event.inputs.debug_bs == 'true') }}
        continue-on-error: true
        run: |
          python bs_diagnostics_report.py diagnostics \
            --json-output reports/bs_diagnostics_summary.json \
            --markdown-output reports/bs_diagnostics_summary.md
          cat reports/bs_diagnostics_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload B/S diagnostics
        if: ${{ always() && (github.event_name == 'push' || github.event.inputs.debug_bs == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: bs-diagnostics
          path: |
            diagnostics/debug_bs_*.json
            reports/bs_diagnostics_summary.json
            reports/bs_diagnostics_summary.md
          if-no-files-found: ignore
          retention-days: 30
